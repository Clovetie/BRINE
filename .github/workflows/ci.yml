name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node tooling
        working-directory: tools
        run: npm ci

      - name: Project layout gate
        run: node tools/validate-project.js

      - name: Luau syntax (luaparse)
        run: node tools/check-syntax.js

      - name: Smoke test (mocked harness)
        run: node tools/smoke-test.js

      - name: Install Luau binaries
        env:
          RETRIES: "5"
        run: bash tools/setup-tools.sh

      - name: Luau compile gate (every source file)
        run: |
          fail=0
          while IFS= read -r f; do
            if ! .tools/bin/luau-compile --text "$f" >/dev/null 2>&1; then
              echo "::error file=$f::luau-compile failed"
              fail=1
            fi
          done < <(find src -name '*.luau')
          exit $fail
